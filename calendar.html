<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calendar - School Event Management</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <!-- From Uiverse.io by AatreyuShau --> 
    <div class="ocean-backdrop"><div class="island-backdrop"></div></div>

    <svg height="0" width="0">
    <filter id="handDrawnNoise">
        <feTurbulence
        result="noise"
        numOctaves="5"
        baseFrequency="0.0065"
        type="fractalNoise"
        ></feTurbulence>
        <feDisplacementMap
        yChannelSelector="G"
        xChannelSelector="R"
        scale="900"
        in2="noise"
        in="SourceGraphic"
        ></feDisplacementMap>
    </filter>
    </svg>


    <button class="menu-btn" id="menuBtn">➜</button>

    <div class="overlay" id="overlay"></div>
    
    <marquee behavior="scroll" direction="left">
        This is the pre-release version of the website, some features may not work as expected. Please be patient while we work on improving the website.
    </marquee>

    <div class="sidebar" id="sidebar">
        <a href="index.html">Home</a>
        <a href="events.html">Events</a>
        <a href="calendar.html">Calendar</a>
        <a href="contact.html">Contact</a>
    </div>
    <div class="bottom-sheet" id="bottomSheet">
        <div class="sheet-header">
            <h2 id="sheetTitle">Events</h2>
        </div>
        <div id="sheetContent"></div>
    </div>

    <h1 class="title">June 2026 Calendar</h1>
    <div class="calendar" id="calendar"></div>

    <script src="calend.js"></script>
    <script src="script.js"></script>
    <script src="cal.js"></script>

</body>
</html>
