<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact - School Event Management</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <!-- From Uiverse.io by AatreyuShau --> 
    <div class="ocean-backdrop"><div class="island-backdrop"></div></div>

    <svg height="0" width="0">
    <filter id="handDrawnNoise">
        <feTurbulence
        result="noise"
        numOctaves="5"
        baseFrequency="0.0065"
        type="fractalNoise"
        ></feTurbulence>
        <feDisplacementMap
        yChannelSelector="G"
        xChannelSelector="R"
        scale="900"
        in2="noise"
        in="SourceGraphic"
        ></feDisplacementMap>
    </filter>
    </svg>

    <button class="menu-btn" id="menuBtn">➜</button>

    <div class="overlay" id="overlay"></div>

    <div class="sidebar" id="sidebar">
        <a href="index.html">Home</a>
        <a href="events.html">Events</a>
        <a href="calendar.html">Calendar</a>
        <a href="contact.html">Contact</a>
    </div>
    
    <marquee behavior="scroll" direction="left">
        This is the pre-release version of the website, some features may not work as expected. Please be patient while we work on improving the website.
    </marquee>

    <h1 class="title">Contact Us</h1>

    <div class="contact-container">

        <form class="contact-form">

            <label>Name</label>
            <input type="text" placeholder="Your name" required>

            <label>Email</label>
            <input type="email" placeholder="Your email" required>

            <label>Message</label>
            <textarea placeholder="Your message" rows="6" required></textarea>

            <button type="submit">Send Message</button>

        </form>

        <div class="contact-info">
            <h2>School Info</h2>
            <p>Email: srinihas.a1_nms@gemsed.com</p>
            <p>Phone: +971 120 8900</p>
            <p>Location: School Campus</p>
        </div>

    </div>

    <script src="script.js"></script>
</body>
</html>
